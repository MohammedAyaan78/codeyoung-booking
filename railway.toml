[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build --workspace=shared && cd backend && npx tsc --project tsconfig.json && cd .. && npm run build --workspace=frontend"

[deploy]
startCommand = "cd backend && npx prisma migrate deploy --schema=../prisma/schema.prisma && node dist/app.js"
restartPolicyType = "on_failure"
